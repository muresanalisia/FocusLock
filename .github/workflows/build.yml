name: Build FocusLock app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the app
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts | head -1)")"
          pwd
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload the app file
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-app
          path: "**/app-debug.apk"
